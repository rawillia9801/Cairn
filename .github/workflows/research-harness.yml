name: Research Harness Validation

on:
  pull_request:
    paths:
      - ".github/workflows/research-harness.yml"
      - ".agents/skills/cairn-pre-genesis/SKILL.md"
      - "experiments/**"
      - "tools/validate-experiment-manifest.mjs"
      - "tools/test-experiment-manifest-integrity.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate example manifest and tamper rejection
        run: node tools/test-experiment-manifest-integrity.mjs
